# Reference derived from Judge0 CE v1.13.1. Untested here; use only on an
# isolated disposable Linux VM after independent security review.
# Judge0's official deployment requires privileged containers: they can
# compromise their host. Never run this on the Django or production server.
services:
  server:
    image: judge0/judge0:1.13.1
    privileged: true
    env_file: ./judge0.conf
    ports:
      - "127.0.0.1:2358:2358"
    restart: unless-stopped
    depends_on:
      - db
      - redis
    # Upstream startup scripts can print environment secrets.
    # Disable these logs for this reference setup; review secure observability.
    logging:
      driver: none

  workers:
    image: judge0/judge0:1.13.1
    privileged: true
    command: ["./scripts/workers"]
    env_file: ./judge0.conf
    restart: unless-stopped
    depends_on:
      - db
      - redis
    # Upstream startup scripts can print environment secrets.
    # Disable these logs for this reference setup; review secure observability.
    logging:
      driver: none

  db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
    volumes:
      - judge0_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: none

  redis:
    image: redis:7.2.4
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?missing REDIS_PASSWORD}
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    restart: unless-stopped
    logging:
      driver: none

volumes:
  judge0_data:
